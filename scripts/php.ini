; PHP Configuration for Brocante Portable
; This is bundled with the Electron app

[PHP]
; Error handling
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On

; Performance
memory_limit = 256M
max_execution_time = 120
max_input_time = 60
post_max_size = 50M
upload_max_filesize = 50M

; Timezone
date.timezone = Africa/Douala

; Extensions required by Laravel
; Note: tokenizer, xml, ctype, dom, filter, bcmath are built-in in PHP 8.1
extension_dir = "ext"
extension=php_mbstring
extension=php_openssl
extension=php_pdo_sqlite
extension=php_sqlite3
extension=php_fileinfo
extension=php_curl
extension=php_gd
extension=php_intl

; SQLite settings
sqlite3.defensive = 1

; Session
session.save_handler = files

; Opcache for better performance
zend_extension=php_opcache
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=4000
opcache.validate_timestamps=0
